name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu 24.04 image already provides the Android SDK and sdkmanager.
      - name: Install Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/cmdline-tools" ]]; then
            echo "::error::Android SDK command-line tools are missing from the runner."
            exit 1
          fi
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            sdk_manager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          if [[ ! -x "$sdk_manager" ]]; then
            echo "::error::Cannot locate an executable sdkmanager under $sdk_root/cmdline-tools."
            exit 1
          fi
          echo "Using Android SDK at $sdk_root"
          echo "Using sdkmanager at $sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v6
        with:
          name: epub-reader-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
